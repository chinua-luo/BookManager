<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookManager</title>
  </head>
  <body>
    <main id="app">
      <header class="toolbar">
        <nav id="app-menu" aria-label="主菜单">
          <details><summary>添加</summary><div class="menu-popup"><button data-action="import-file">导入文件</button><button data-action="add-folder">添加文件夹</button></div></details>
          <button class="toolbar-button" data-action="create-folder">新建文件夹</button>
          <details><summary>打开</summary><div class="menu-popup"><button data-action="open-selected">打开文件</button><button data-action="show-location-selected">打开底层</button></div></details>
          <button class="toolbar-button" data-action="rename-selected">按规则重命名</button>
          <button class="toolbar-button" data-action="save-text">保存文本改动</button>
          <button class="toolbar-button" data-action="crawl">爬取系列</button>
          <details><summary>设置</summary><div class="menu-popup"><button data-action="data-location">数据位置</button><button data-action="cache-settings">缓存管理</button></div></details>
          <details><summary>帮助</summary><div class="menu-popup"><button data-action="help">功能介绍</button><button data-action="shortcuts">快捷键</button></div></details>
        </nav>
        <span id="status">正在连接资料库…</span>
        <button id="search-button" class="toolbar-button" data-action="search">搜索</button>
      </header>
      <section class="workspace">
        <aside class="sidebar">
          <section class="folder-panel">
            <h2>文件夹</h2>
            <nav id="folder-tree" aria-label="文件夹树"></nav>
          </section>
          <section class="content-panel">
            <div class="panel-heading"><h2 id="content-title">本文件夹内容</h2><span id="content-count"></span></div>
            <div id="content-list" tabindex="0"></div>
          </section>
        </aside>
        <div id="workspace-splitter" class="workspace-splitter" role="separator" aria-label="调整左右分栏宽度" aria-orientation="vertical" tabindex="0"></div>
        <section class="preview-panel">
          <h1 id="preview-title">预览</h1>
          <div id="preview" class="preview-surface"></div>
        </section>
      </section>
    </main>
    <div id="context-menu" class="context-menu" hidden></div>
    <div id="modal-root" hidden></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
